  dataset: "sen12mscr_raw"
  root: "/home/data/KXShen/SEN12MSCR/SEN12MSCR"
  image_ext: ".tif"
  bands: [1, 2, 3]
  s2_clip_min: 0.0
  s2_clip_max: 10000.0
  s1_db_min: -25.0
  s1_db_max: 0.0
  split_csv: "/home/ps/KXShen/syncfolder/project0103/supplementary_SEN12MSCR/splits.csv"
